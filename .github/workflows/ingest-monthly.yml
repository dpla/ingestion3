name: Monthly Hub Batch

# Fires all active standard hubs for the current month as a sequential
# batch on the ingest EC2. Special hubs (NARA, Smithsonian, Community Webs)
# require preprocessing — use the "Launch Hub Ingest" workflow for those.
#
# The batch runs on EC2 as a nohup background job; this GHA step finishes
# once the job is launched. Progress arrives via Slack as each hub completes.
#
# OIDC credentials are restricted to main by the role trust policy.

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to run (1-12) — defaults to current month'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Print hub list without launching'
        required: false
        type: boolean
        default: false

  # Uncomment to run automatically on the 1st of each month at 1pm UTC (9am ET).
  # Ensure ingestion3-conf is up to date and any special-hub preprocessing is
  # complete before enabling this.
  #
  # schedule:
  #   - cron: '0 13 1 * *'

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  batch:
    name: 'Monthly batch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30   # just the launch; the EC2 does the real work in background

    steps:
      - name: Enforce main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::This workflow must run from main — the OIDC role trust policy restricts credentials to main only."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: arn:aws:iam::283408157088:role/github-actions-ingestion3
          aws-region: us-east-1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      # Starts the EC2 if stopped, waits for SSM Online, resets both repos,
      # and rebuilds the fat JAR if stale.
      - name: Box preflight — start EC2, sync repos, rebuild JAR if stale
        env:
          INGEST_INSTANCE_ID: ${{ secrets.INGEST_INSTANCE_ID }}
          CI: '1'
        run: |
          python3 ingest_python_scripts/hub_preflight.py \
            --non-interactive \
            --skip-endpoint

      # Reads i3.conf from EC2, prints the hub list, then fires a sequential
      # bash batch script on EC2 as a nohup background job and returns.
      - name: Launch monthly batch
        env:
          INGEST_INSTANCE_ID: ${{ secrets.INGEST_INSTANCE_ID }}
          CI: '1'
        run: |
          set -euo pipefail
          ARGS=()
          [[ -n "${{ inputs.month }}" ]]           && ARGS+=(--month "${{ inputs.month }}")
          [[ "${{ inputs.dry_run }}" == "true" ]]  && ARGS+=(--dry-run)
          python3 ingest_python_scripts/run_monthly_batch.py "${ARGS[@]}"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [[ -z "${SLACK_WEBHOOK_URL:-}" ]] && exit 0
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \":x: *Monthly batch launch FAILED* — triggered by ${{ github.actor }} — <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|View run>\"}"
