name: Update File Hub Endpoints

# For each hub where harvest.type = "file" and the endpoint is an S3 path,
# finds the latest dated delivery in that bucket and updates i3.conf if stale.
# Commits and pushes the change to ingestion3-conf.
#
# Requires:
#   - INGESTION3_CONF_DEPLOY_KEY secret: SSH private key with write access to
#     the ingestion3-conf repo (add its public key as a deploy key there with
#     "Allow write access" checked)
#   - OIDC role for AWS access (s3:ListBucket on dpla-hub-* buckets)
#
# OIDC credentials are restricted to main by the role trust policy.

on:
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC AWS auth
  contents: read

jobs:
  update-endpoints:
    name: 'Update file hub endpoints'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Enforce main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::This workflow must run from main."
            exit 1
          fi

      - name: Check out ingestion3 (for the update script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: ingestion3

      - name: Check out ingestion3-conf (with deploy key for write access)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: dpla/ingestion3-conf
          ssh-key: ${{ secrets.INGESTION3_CONF_DEPLOY_KEY }}
          path: ingestion3-conf

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: arn:aws:iam::283408157088:role/github-actions-ingestion3
          aws-region: us-east-1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Detect stale endpoints (dry run)
        id: dry-run
        run: |
          python3 ingestion3/ingest_python_scripts/update_file_endpoints.py \
            --conf ingestion3-conf/i3.conf \
            | tee /tmp/endpoint-report.txt

      - name: Apply updates to i3.conf
        id: apply
        run: |
          python3 ingestion3/ingest_python_scripts/update_file_endpoints.py \
            --conf ingestion3-conf/i3.conf \
            --apply

      - name: Commit and push changes
        id: commit
        working-directory: ingestion3-conf
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet i3.conf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            CHANGED=$(git diff --name-only i3.conf)
            SUMMARY=$(git diff --unified=0 i3.conf \
              | grep "^[-+].*harvest\.endpoint" \
              | sed 's/^-/  old: /; s/^+/  new: /')
            echo "$SUMMARY"

            git add i3.conf
            git commit -m "chore: auto-update file hub endpoints

Detected by update-file-endpoints workflow — run $GITHUB_RUN_ID
Triggered by: ${{ github.actor }}

$(cat /tmp/endpoint-report.txt | grep -E '→|already up to date|Error' | sed 's/^/  /')"

            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack — changes pushed
        if: steps.commit.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ -z "${SLACK_WEBHOOK_URL:-}" ]] && exit 0
          # Build a compact diff summary for Slack
          DIFF=$(cat /tmp/endpoint-report.txt \
            | grep -E '(^  [a-z]|→)' \
            | sed 's/^  //; s/  → /\n    → /' \
            | head -40)
          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg diff "$DIFF" \
            '{text: ":pencil: *File hub endpoints updated* by \($actor) — <\($url)|View run>\n```\($diff)```"}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"

      - name: Notify Slack — no changes
        if: steps.commit.outputs.changed != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ -z "${SLACK_WEBHOOK_URL:-}" ]] && exit 0
          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ":white_check_mark: *File hub endpoint check* — all endpoints already up to date (triggered by \($actor)) — <\($url)|View run>"}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ -z "${SLACK_WEBHOOK_URL:-}" ]] && exit 0
          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ":x: *File hub endpoint update FAILED* — triggered by \($actor) — <\($url)|View run>"}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
